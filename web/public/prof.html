<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فضاء الأستاذ — كلية العلوم القانونية والسياسية طنجة</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, 'Traditional Arabic', Arial, sans-serif; }
    .slot .btn.small { margin: 5px 0 0 6px; }
    .rooms .badge { cursor: pointer; margin: 2px; }
    .rooms .badge:hover { filter: brightness(1.1); }
    .tbl-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <header id="hd"></header>
  <main>
    <!-- Connexion -->
    <div class="card" id="loginCard">
      <h2>فضاء الأستاذ — تسجيل الدخول</h2>
      <p class="muted">تم تسليم بيانات الدخول الخاصة بكم من طرف الإدارة.</p>
      <label for="login">المعرف</label>
      <input id="login" autocomplete="username" dir="ltr">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" dir="ltr">
      <div style="margin-top:12px"><button class="btn" id="doLogin">دخول</button></div>
      <div id="loginErr"></div>
    </div>

    <!-- Tableau de bord -->
    <div id="dash" class="hidden">
      <div class="card">
        <div class="row">
          <div><h2 id="hello" style="margin:0"></h2><p class="muted" id="masters"></p></div>
          <div style="flex:0 0 auto" class="navbtns">
            <button class="btn ghost" id="prev">→ الأسبوع السابق</button>
            <button class="btn ghost" id="today">هذا الأسبوع</button>
            <button class="btn ghost" id="next">الأسبوع المقبل ←</button>
            <button class="btn ghost" id="logout">تسجيل الخروج</button>
          </div>
        </div>
        <p class="muted" id="weekLabel" style="margin-top:6px"></p>
      </div>
      <div class="card">
        <h2>حصصي</h2>
        <div id="sessions"></div>
      </div>
      <div class="card">
        <h2>طلباتي</h2>
        <div id="requests"></div>
      </div>
    </div>

    <!-- Choix du créneau de report -->
    <div class="card hidden" id="moveCard">
      <h2>اقتراح تأجيل</h2>
      <p class="muted" id="moveInfo"></p>
      <input type="text" id="moveReason" placeholder="سبب التأجيل (اختياري)"
        style="width:100%; padding:8px 10px; margin:8px 0; border:1px solid #cbd5e1; border-radius:8px; font:inherit">
      <div id="slots"></div>
      <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn" id="moveNoChoice">إرسال الطلب فقط — تختار الإدارة التوقيت</button>
        <button class="btn ghost" id="moveCancel">رجوع</button>
      </div>
    </div>

    <!-- Annulation d'une séance -->
    <div class="card hidden" id="cancelCard">
      <h2>إلغاء الحصة</h2>
      <p class="muted" id="cancelInfo"></p>
      <input type="text" id="cancelReason" placeholder="سبب الإلغاء (سيظهر في الإعلان للطلبة)"
        style="width:100%; padding:8px 10px; margin:8px 0; border:1px solid #cbd5e1; border-radius:8px; font:inherit">
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn danger" id="doCancel">تأكيد الإلغاء</button>
        <button class="btn ghost" id="cancelBack">رجوع</button>
      </div>
    </div>
  </main>
  <div id="toast" style="position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#0f766e; color:#fff; padding:10px 20px; border-radius:10px; display:none; z-index:50"></div>
  <footer>MasterTime Tanger — FSJP</footer>
  <script src="/app.js"></script>
  <script>
    document.getElementById('hd').innerHTML = MT.header('prof');
    MT.heartbeat();

    let me = null;
    let week = MT.mondayOf(MT.today());

    async function init() {
      try {
        me = await MT.api('/api/prof/me');
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('dash').classList.remove('hidden');
        document.getElementById('hello').textContent = me.full_name;
        document.getElementById('masters').textContent =
          me.masters.map((m) => m.name).join(' · ');
        load();
        loadRequests();
      } catch { /* غير مسجل */ }
    }

    for (const id of ['login', 'password']) {
      document.getElementById(id).addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('doLogin').click();
      });
    }
    document.getElementById('doLogin').onclick = async () => {
      try {
        await MT.api('/api/prof/login', {
          method: 'POST',
          body: JSON.stringify({
            login: document.getElementById('login').value,
            password: document.getElementById('password').value,
          }),
        });
        init();
      } catch (e) {
        document.getElementById('loginErr').innerHTML = `<p class="err">${e.message}</p>`;
      }
    };
    document.getElementById('logout').onclick = async () => {
      await MT.api('/api/prof/logout', { method: 'POST' });
      location.reload();
    };
    document.getElementById('prev').onclick = () => { week = MT.addDays(week, -7); load(); };
    document.getElementById('next').onclick = () => { week = MT.addDays(week, 7); load(); };
    document.getElementById('today').onclick = () => { week = MT.mondayOf(MT.today()); load(); };

    async function load() {
      const el = document.getElementById('sessions');
      const data = await MT.api(`/api/prof/sessions?week=${week}`);
      document.getElementById('weekLabel').textContent =
        `الأسبوع من ${data.weekStart.split('-').reverse().join('/')}`;
      if (!data.sessions.length) { el.innerHTML = '<p class="muted">لا توجد حصص هذا الأسبوع.</p>'; return; }
      const today = MT.today();
      const cls = { PREVUE: '', REALISEE: 'ok', ANNULEE: 'off', REPORTEE: 'reportee', NON_ENCORE_REALISEE: 'idle' };
      const lbl = { PREVUE: 'مجدولة', REALISEE: 'تمت', ANNULEE: 'ملغاة', REPORTEE: 'مؤجلة', NON_ENCORE_REALISEE: 'لم تتم' };
      const cols = Array.from({ length: 7 }, () => []);
      for (const s of data.sessions) {
        const wd = (new Date(`${s.date}T00:00:00`).getDay() + 6) % 7;
        cols[wd].push(s);
      }
      el.innerHTML = '<div class="edt-grid">' + cols.map((ss, i) => {
        const dayIso = MT.addDays(data.weekStart, i);
        return `<div class="day-col${dayIso === today ? ' today' : ''}">
          <h3>${MT.fmtDayAr(dayIso)}</h3>
          ${ss.length === 0 ? '<span class="muted">—</span>' : ss.map((s) => {
            const can = ['PREVUE', 'REPORTEE'].includes(s.status) && !s.pending_requests && s.date >= today;
            return `<div class="slot ${cls[s.status] ?? ''}">
              <span class="tm">${MT.hm(s.start_min)}–${MT.hm(s.end_min)}</span>
              <span class="mod">${s.module_name}</span>
              <small>${s.master_name}</small>
              <small>${MT.arRoom(s.room_name)}</small>
              <small>${lbl[s.status] ?? s.status}${s.pending_requests ? ' · طلب قيد المعالجة' : ''}</small>
              ${can ? `<div>
                <button class="btn small danger" onclick="askCancel(${s.id})">إلغاء</button>
                <button class="btn small" onclick="askMove(${s.id})">تأجيل</button>
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>`;
      }).join('') + '</div>';
    }

    let toastTimer = null;
    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isErr ? '#b91c1c' : '#0f766e';
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    window.askCancel = (sid) => {
      window._cancelSid = sid;
      document.getElementById('cancelReason').value = '';
      document.getElementById('cancelCard').classList.remove('hidden');
      document.getElementById('cancelCard').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('cancelReason').focus();
    };

    document.getElementById('doCancel').onclick = async () => {
      try {
        await MT.api('/api/prof/requests', {
          method: 'POST',
          body: JSON.stringify({
            session_id: window._cancelSid, kind: 'cancel',
            reason: document.getElementById('cancelReason').value,
          }),
        });
        document.getElementById('cancelCard').classList.add('hidden');
        load(); loadRequests();
        toast('تم إرسال طلب الإلغاء — في انتظار مصادقة الإدارة.');
      } catch (e) { toast(e.message, true); }
    };
    document.getElementById('cancelBack').onclick = () =>
      document.getElementById('cancelCard').classList.add('hidden');

    window.askMove = async (sid) => {
      window._moveSid = sid;
      document.getElementById('moveReason').value = '';
      const card = document.getElementById('moveCard');
      card.classList.remove('hidden');
      const el = document.getElementById('slots');
      el.innerHTML = '<p class="muted">البحث عن الأوقات الشاغرة…</p>';
      card.scrollIntoView({ behavior: 'smooth' });
      try {
        const slots = await MT.api(`/api/prof/free-slots?session_id=${sid}`);
        if (!slots.length) {
          el.innerHTML = '<p class="muted">لا توجد أوقات شاغرة في الأسابيع المقبلة.</p>';
          return;
        }
        document.getElementById('moveInfo').textContent =
          'الأوقات الشاغرة المتاحة — اضغط على القاعة لاختيار الموعد :';
        el.innerHTML = slots.map((sl, i) => `
          <div class="notice rooms">
            <b>${MT.fmtDayAr(sl.date)} · ${MT.hm(sl.start_min)}–${MT.hm(sl.end_min)}</b><br>
            ${sl.rooms.map((r, j) => `<span class="badge blue" onclick="pickRoom(${sid},${i},${j})">${MT.arRoom(r.name)} · ${r.capacity} مقعد</span>`).join(' ')}
          </div>`).join('');
        window._slots = slots;
      } catch (e) { el.innerHTML = `<p class="err">${e.message}</p>`; }
    };

    async function sendMove(sid, body) {
      try {
        await MT.api('/api/prof/requests', {
          method: 'POST',
          body: JSON.stringify({ session_id: sid, kind: 'move', ...body }),
        });
        document.getElementById('moveCard').classList.add('hidden');
        load(); loadRequests();
        toast('تم إرسال الطلب — في انتظار مصادقة الإدارة.');
      } catch (e) { toast(e.message, true); }
    }

    window.pickRoom = (sid, i, j) => {
      const sl = window._slots[i];
      const room = sl.rooms[j];
      sendMove(sid, {
        reason: document.getElementById('moveReason').value,
        proposed: { date: sl.date, start_min: sl.start_min, end_min: sl.end_min, room_id: room.id },
      });
    };

    document.getElementById('moveNoChoice').onclick = () =>
      sendMove(window._moveSid, { reason: document.getElementById('moveReason').value });

    document.getElementById('moveCancel').onclick = () =>
      document.getElementById('moveCard').classList.add('hidden');

    async function loadRequests() {
      const el = document.getElementById('requests');
      const rows = await MT.api('/api/prof/requests');
      if (!rows.length) { el.innerHTML = '<p class="muted">لا توجد طلبات.</p>'; return; }
      const badge = { pending: 'gold', approved: 'green', rejected: 'red' };
      const lbl = { pending: 'قيد الانتظار', approved: 'مقبولة', rejected: 'مرفوضة' };
      el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><tr><th>الحصة</th><th>النوع</th><th>الاقتراح</th><th>الحالة</th><th>ملاحظة الإدارة</th></tr>` +
        rows.map((r) => `<tr>
          <td>${MT.fmtDayAr(r.session_date)} ${MT.hm(r.start_min)}–${MT.hm(r.end_min)}<br><span class="muted">${r.module_name} · ${r.master_name}</span></td>
          <td>${r.kind === 'cancel' ? 'إلغاء' : 'تأجيل'}</td>
          <td>${r.kind === 'move' ? (r.proposed_date ? `${MT.fmtDayAr(r.proposed_date)} ${MT.hm(r.proposed_start_min)}–${MT.hm(r.proposed_end_min)}<br>${MT.arRoom(r.proposed_room_name ?? '')}` : 'الإدارة ستختار التوقيت') : '—'}</td>
          <td><span class="badge ${badge[r.status]}">${lbl[r.status]}</span></td>
          <td class="muted">${r.admin_note || '—'}</td>
        </tr>`).join('') + '</table></div>';
    }

    init();
  </script>
</body>
</html>
