<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جدول الحصص — كلية العلوم القانونية والسياسية طنجة</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, 'Traditional Arabic', Arial, sans-serif; }
    .sheet-head { margin-bottom: 14px; }
    .sheet-head .prog { font-weight: 700; font-size: 22px; color: var(--navy); text-align: center; margin-bottom: 12px; }
    .sheet-head .meta { font-size: 16px; line-height: 1.9; }
    .sheet-head .meta .lbl { display: inline-block; min-width: 130px; }
    .sheet-head .meta b { color: var(--navy); }
    .tbl { font-size: 15px; }
    .tbl th { font-size: 14px; }
    .tbl td.off .mod { text-decoration: line-through; color: var(--muted); }
    .tbl tr.off td { background: #f1f5f9; }
    .dayname { font-weight: 700; color: var(--navy); white-space: nowrap; }
    .daydate { font-size: 12px; font-weight: 400; color: var(--muted); }
    .navbtns { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 12px; }
    @media print {
      header, .controls, footer { display: none !important; }
      main { margin: 0; max-width: none; }
      .card { box-shadow: none; border: 1px solid #cbd5e1; }
    }
  </style>
</head>
<body>
  <header id="hd"></header>
  <main>
    <div class="card controls">
      <div class="row">
        <div>
          <label for="master">الماستر</label>
          <select id="master"></select>
        </div>
        <div style="flex:0 0 auto" class="navbtns">
          <button class="btn ghost" id="prev">← الأسبوع السابق</button>
          <button class="btn ghost" id="today">هذا الأسبوع</button>
          <button class="btn ghost" id="next">الأسبوع المقبل →</button>
          <button class="btn" id="print">طباعة</button>
        </div>
      </div>
      <p class="muted" id="weekLabel" style="margin-top:8px"></p>
    </div>
    <div class="card">
      <div id="grid"><p class="muted">اختر ماستر…</p></div>
    </div>
  </main>
  <footer>MasterTime Tanger — FSJP · <span data-online>–</span> متصل</footer>
  <script src="/app.js"></script>
  <script>
    document.getElementById('hd').innerHTML = MT.header('edt');
    MT.heartbeat();

    const AR_DAYS = ['الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
    const AR_SEM = { 1: 'الأول', 2: 'الثاني', 3: 'الثالث', 4: 'الرابع' };
    const arRoom = (n) => String(n || '')
      .replace(/^Salle\s*/, 'القاعة ')
      .replace(/^Amphi\s*/, 'المدرج ')
      .replace(/^Annexe\s*/, 'الملحقة ');
    const arDay = (iso) => AR_DAYS[(new Date(`${iso}T00:00:00`).getDay() + 6) % 7];
    const arYear = (lbl) => String(lbl || '').replace('-', '/');

    const params = new URLSearchParams(location.search);
    let week = MT.mondayOf(MT.today());
    let masterId = params.get('master') || '';
    let navigated = false;

    const sel = document.getElementById('master');
    MT.api('/api/masters').then((rows) => {
      sel.innerHTML = '<option value="">— اختر —</option>' +
        rows.map((m) => `<option value="${m.id}" ${String(m.id) === masterId ? 'selected' : ''}>${m.name}${m.level ? ` (${m.level === 'M1' ? 'س1/س2' : 'س3/س4'})` : ''}</option>`).join('');
      if (masterId) load();
    });

    sel.onchange = () => { masterId = sel.value; navigated = false; load(); };
    document.getElementById('prev').onclick = () => { week = MT.addDays(week, -7); load(); };
    document.getElementById('next').onclick = () => { week = MT.addDays(week, 7); load(); };
    document.getElementById('today').onclick = () => { week = MT.mondayOf(MT.today()); load(); };
    document.getElementById('print').onclick = () => window.print();

    async function load() {
      const grid = document.getElementById('grid');
      if (!masterId) { grid.innerHTML = '<p class="muted">اختر ماستر…</p>'; return; }
      grid.innerHTML = '<p class="muted">جار التحميل…</p>';
      try {
        const data = await MT.api(`/api/edt?master_id=${masterId}&week=${week}`);
        if (data.sessions.length === 0 && !navigated && data.firstSessionDate) {
          navigated = true;
          week = MT.mondayOf(data.firstSessionDate);
          return load();
        }
        navigated = true;
        document.getElementById('weekLabel').textContent =
          `الأسبوع من ${data.weekStart.split('-').reverse().join('/')}`;
        const m = data.master;
        const sessions = [...data.sessions].sort((a, b) =>
          a.date === b.date ? a.start_min - b.start_min : a.date < b.date ? -1 : 1);
        const rows = sessions.map((s) => {
          const off = s.status === 'ANNULEE';
          const tag = { REPORTEE: '<span class="badge gold">مؤجلة</span>', ANNULEE: '<span class="badge red">ملغاة</span>', REALISEE: '<span class="badge green">تمت</span>' }[s.status] || '';
          return `<tr class="${off ? 'off' : ''}">
            <td class="mod">${s.module_name} ${tag}</td>
            <td>${s.professor_name}</td>
            <td class="dayname">${arDay(s.date)}<div class="daydate">${s.date.split('-').reverse().join('/')}</div></td>
            <td style="white-space:nowrap">${MT.hm(s.start_min)} - ${MT.hm(s.end_min)}</td>
            <td>${arRoom(s.room_name)}</td>
          </tr>`;
        }).join('');
        grid.innerHTML = `
          <div class="sheet-head">
            <div class="prog">برنامج توزيع الحصص</div>
            <div class="meta">
              <div><span class="lbl">ماستر :</span> <b>${m.name}</b></div>
              ${m.semester_ordinal ? `<div><span class="lbl">السداسي :</span> <b>${AR_SEM[m.semester_ordinal] || m.semester_ordinal}</b></div>` : ''}
              ${m.year_label ? `<div><span class="lbl">السنة الجامعية :</span> <b>${arYear(m.year_label)}</b></div>` : ''}
              ${m.responsible_name ? `<div><span class="lbl">المنسق :</span> <b>${m.responsible_name}</b></div>` : ''}
            </div>
          </div>
          ${sessions.length === 0
            ? '<p class="muted">لا توجد حصص هذا الأسبوع.</p>'
            : `<table class="tbl"><tr>
                <th>الوحدة</th><th>الأستاذ</th><th>اليوم</th><th>التوقيت</th><th>القاعة/المدرج</th>
              </tr>${rows}</table>`}`;
      } catch (e) {
        grid.innerHTML = `<p class="err">${e.message}</p>`;
      }
    }
  </script>
</body>
</html>
